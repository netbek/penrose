default_language_version:
  node: 26.12.1

default_stages: [pre-commit]

fail_fast: true

repos:
  - repo: local
    hooks:
      - id: prettier-js
        name: prettier (js)
        entry: pnpm --silent exec prettier --write --ignore-unknown
        language: system
        pass_filenames: true
        require_serial: true
        files: ^(lib)/.*\.(js|jsx|cjs|mjs)$
